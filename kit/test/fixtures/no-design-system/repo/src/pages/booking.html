<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book a berth — Berthline</title>
</head>
<body>
<h1>Book a berth</h1>
<form method="post">
  <label>Boat name <input name="boat" required></label>
  <label>Length overall (m) <input name="length" type="number" step="0.1" required></label>
  <label>Arrive <input name="from" type="datetime-local" required></label>
  <label>Leave <input name="to" type="datetime-local" required></label>
  <label>Phone <input name="phone" type="tel" required></label>
  <label><input type="checkbox" name="power"> Shore power</label>
  <button type="submit">Book</button>
</form>
</body>
</html>
