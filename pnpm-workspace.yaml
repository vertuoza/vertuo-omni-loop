# The root package is the delivery kit and the game layer; apps/ and packages/ hold the galaxy UI.
packages:
  - '.'
  - 'apps/*'
  - 'packages/*'
# pnpm settings live here since pnpm 10, which no longer reads the `pnpm` field of package.json.
allowBuilds:
  esbuild: true
  protobufjs: true
ignoredOptionalDependencies:
  - fallow-type-aware
