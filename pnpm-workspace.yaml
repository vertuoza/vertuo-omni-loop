# The root package is the delivery kit and the game layer; apps/ and packages/ hold the galaxy UI.
packages:
  - '.'
  - 'apps/*'
  - 'packages/*'
  # The e2e project (PRD 2898): the e2e framework, its config and the scenarios, in `e2e.dir`.
  - 'e2e'
# pnpm settings live here since pnpm 10, which no longer reads the `pnpm` field of package.json.
allowBuilds:
  esbuild: true
  protobufjs: true
  vue-demi: false
ignoredOptionalDependencies:
  - fallow-type-aware
