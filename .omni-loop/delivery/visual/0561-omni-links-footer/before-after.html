<!doctype html><html><head><meta charset="utf-8"><title>Sidebar Omni foot — before/after</title>
<style>
:root{--ground:#f5f4fc;--surface:#fff;--sunk:#eceaf8;--line:#d9d6ee;--ls:#85819f;--ink:#17153d;--muted:#4f5486;--plasma:#6a2fd0;--soft:#efe7ff}
body{margin:0;padding:24px;background:var(--ground);font:15px/1.4 system-ui,sans-serif;color:var(--ink)}
h1{font-size:18px;margin:0 0 4px} p.note{margin:0 0 20px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:24px}
figure{margin:0} figcaption{font-weight:700;margin:0 0 8px} figcaption small{display:block;font-weight:400;color:var(--muted);max-width:240px}
.sb{width:240px;height:560px;box-sizing:border-box;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.crest{font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:10px}.crest i{width:28px;height:28px;border-radius:50%;background:var(--plasma);display:inline-block}
.ws{color:var(--muted);font-size:14px;margin:-12px 0 0}
.lbl{margin:0;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
a.it{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:1px solid transparent;font:700 15px/1.3 system-ui;color:var(--ink);text-decoration:none}
a.cur{color:var(--plasma);border-color:var(--plasma);background:var(--ground)}
.out{margin-left:auto;display:inline-flex;color:var(--muted)}
.badge{margin-left:auto;min-width:20px;padding:3px 6px;border-radius:999px;font:700 12px/1 system-ui;text-align:center;color:#fff;background:var(--plasma)}
.kid{padding-left:14px}
.grp{display:grid;gap:4px}
.push{margin-top:auto}
.ver{font:500 12px/1.2 ui-monospace,Menlo,monospace;color:var(--muted)}
.pill{margin-left:auto;font:600 11px/1 ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:999px;background:var(--soft);color:var(--plasma)}
.small{transform:scale(.6);transform-origin:top left;width:150px;height:360px;overflow:visible}.small .sb,.small figcaption{width:240px}h2{font-size:16px;margin:32px 0 12px}</style></head><body>
