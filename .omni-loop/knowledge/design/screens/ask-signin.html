<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ask-signin · draft</title>
<style>
/* The page itself: Omni's reading tokens (ASK.omni in packages/design/src/tokens.ts). */
:root {
  --page: #07061c; --page-ink: #f2f4ff; --page-muted: #8a90d6; --page-line: #1a2170; --page-line-strong: #5a60c4; --page-plasma: #ffd84a;
  --chrome: #e8e8ec; --chrome-ink: #3c3c43; --chrome-muted: #6b6b73;
  --read: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --pixel: "Press Start 2P", "Courier New", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-ink); font: 17px/1.6 var(--read); }
main.doc { max-width: 1320px; margin: 0 auto; padding: 32px 16px 72px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; }
h2 { font-size: 1.35rem; margin: 56px 0 8px; border-bottom: 1px solid var(--page-line); padding-bottom: 6px; }
h3 { font-size: .95rem; margin: 32px 0 8px; color: var(--page-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
p.lead, p.note { color: var(--page-muted); margin: 0 0 14px; max-width: 900px; }
.doc code { font: .88em var(--mono); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 12px 0 6px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 12px 0 6px; }
@media (max-width: 1000px) { .pair, .trio { grid-template-columns: 1fr; } }
.col { min-width: 0; }
.tag { display: inline-block; font-size: .8rem; padding: 1px 9px; border: 1px solid var(--page-line-strong); border-radius: 999px; margin-bottom: 8px; color: var(--page-muted); }
.tag.after { border-color: var(--page-plasma); color: var(--page-plasma); }
.caption { color: var(--page-muted); font-size: .9rem; margin: 6px 0 0; max-width: 900px; }
table.map { border-collapse: collapse; width: 100%; font-size: .93rem; margin: 10px 0; }
.map th, .map td { text-align: left; border-bottom: 1px solid var(--page-line); padding: 7px 8px; vertical-align: top; }
.map th { color: var(--page-muted); font-weight: 600; }
.tree { background: #000; border: 1px solid var(--page-line); border-radius: 8px; padding: 12px 14px; font: 13px/1.6 var(--mono); white-space: pre; overflow-x: auto; color: #d7dae8; }
.tree .add { color: #4ee08a; } .tree .mv { color: #ffd84a; } .tree .dim { color: #7c80a6; }
.screens-line { font: 14px/1.5 var(--mono); color: var(--page-ink); background: #0e0d33; border: 1px solid var(--page-line); border-radius: 8px; padding: 8px 12px; display: inline-block; }

/* A browser window around each screen. */
.win { border: 1px solid var(--page-line-strong); border-radius: 10px; overflow: hidden; }
.bar { background: var(--chrome); color: var(--chrome-ink); font: 12px/1 var(--read); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.bar .url { flex: 1; background: #fff; border-radius: 6px; padding: 6px 10px; color: var(--chrome-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.phone { max-width: 393px; margin: 0 auto; border-radius: 22px; }

/* ── The screens: Ask's three themes, as the product names them ─────────── */
.screen { --ground:#07061c; --surface:#120f3a; --sunk:#0e0d33; --line:#1a2170; --line-strong:#5a60c4; --ink:#f2f4ff; --muted:#8a90d6;
  --plasma:#ffd84a; --plasma-soft:#2a2350; --on-plasma:#07061c; --cyan:#6ff0ff; --green:#4ee08a; --red:#ff6b86;
  background: var(--ground); color: var(--ink); font: 15px/1.6 var(--read); position: relative; }
.screen.t-light { --ground:#f5f4fc; --surface:#ffffff; --sunk:#eceaf8; --line:#d9d6ee; --line-strong:#85819f; --ink:#17153d; --muted:#4f5486;
  --plasma:#4b1fb0; --plasma-soft:#efe7ff; --on-plasma:#ffffff; --cyan:#0b6f86; --green:#15703f; --red:#b3122f; }
.screen.t-dark { --ground:#0e0d33; --surface:#16144a; --sunk:#1d1a58; --line:#2f2c78; --line-strong:#6d6acc; --ink:#f2f4ff; --muted:#a9aee6;
  --plasma:#b37cff; --plasma-soft:#2a1d66; --on-plasma:#0e0d33; --cyan:#6ff0ff; --green:#4ee08a; --red:#ff6b86; }

/* The card, as ask.css draws it. */
.card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 20px; width: 100%; max-width: 460px; text-align: left; }
.card h4 { margin: 0 0 8px; font-size: 1.12rem; line-height: 1.35; }
.card p { margin: 0 0 14px; color: var(--muted); font-size: .94rem; }
.card p:last-child { margin-bottom: 0; }
.card a { color: var(--cyan); }
.card code { font: .9em var(--mono); color: var(--ink); }
.btn { display: inline-block; font: 600 15px/1 var(--read); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--plasma); background: var(--plasma); color: var(--on-plasma); }
.btn.quiet { background: transparent; color: var(--cyan); border-color: transparent; padding-left: 4px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.row:last-child { margin-bottom: 0; }
.ok-mark { color: var(--green); }
/* Today's code: mono. After: the pixel face at 24 px (3 × 8). */
.code { font: 600 26px/1 var(--mono); letter-spacing: .14em; color: var(--ink); background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px 0; text-align: center; margin: 0 0 16px; }
.code.pixel { font: 24px/1 var(--pixel); letter-spacing: 0; padding: 18px 0; }
.phone .code.pixel { font-size: 16px; }

/* Today: the app shell around the card. */
.shell { display: grid; grid-template-columns: 168px 1fr; min-height: 380px; }
.side { background: #0f0d34; border-right: 1px solid var(--line); padding: 12px 10px; font-size: 12px; }
.side .brand { font: 10px/1 var(--pixel); color: var(--plasma); margin: 4px 0 4px; }
.side .ws { color: var(--muted); margin-bottom: 12px; }
.side .grp { font-size: 10px; letter-spacing: .08em; color: var(--muted); margin: 10px 0 4px; }
.side .it { padding: 3px 6px; border-radius: 5px; color: var(--ink); }
.side .it.on { outline: 1px solid var(--plasma); color: var(--plasma); }
.topbar { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-strong); padding: 10px 14px; font-size: 13px; }
.topbar .trail { flex: 1; } .topbar .trail span { color: var(--muted); }
.pill { border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; font-size: 11px; }
.pill.y { background: var(--plasma); color: var(--on-plasma); border-color: var(--plasma); }
.shell .body { padding: 18px; }
.shell .card { max-width: none; }

/* Today: /signup's bare column. */
.bare { padding: 28px 20px 36px; min-height: 380px; }

/* After: the doorway. */
.doorway { min-height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 40px 16px; overflow: hidden; }
.doorway .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.doorway.t-light .stars { display: none; }
.doorway > :not(.stars) { position: relative; }
.doorway .mark { display: block; line-height: 0; }
.doorway .foot { color: var(--muted); font-size: .85rem; }
.doorway .foot a { color: var(--muted); }
.phone .doorway { min-height: 600px; padding: 32px 16px; justify-content: flex-start; padding-top: 72px; }
.mini .doorway { min-height: 340px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; margin-top: 16px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
