<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug record mockup</title>
<style>
  /* Ask's reading tokens, theme Omni (ASK.omni in packages/design/src/tokens.ts). Faces named first,
     served by the app; here they fall back to system faces. */
  :root {
    --ask-ground: #07061c; --ask-surface: #120f3a; --ask-sunk: #0e0d33; --ask-line: #1a2170; --ask-line-strong: #5a60c4;
    --ask-ink: #f2f4ff; --ask-muted: #8a90d6; --ask-plasma: #ffd84a; --ask-plasma-soft: #2a2350; --ask-on-plasma: #07061c;
    --ask-cyan: #6ff0ff; --ask-green: #4ee08a; --ask-red: #ff6b86;
    --ask-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ask-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #03020f; color: var(--ask-ink); font: 17px/1.6 var(--ask-body); }
  .note { max-width: 1180px; margin: 0 auto; padding: 24px 16px 8px; font: 14px/1.55 system-ui, sans-serif; color: var(--ask-muted); }
  .note h1 { margin: 0 0 6px; font-size: 22px; color: var(--ask-ink); }
  .note p { margin: 0 0 6px; max-width: 86ch; }
  .note b { color: var(--ask-ink); }
  h2.part { max-width: 1180px; margin: 40px auto 0; padding: 0 16px; font: 700 18px/1.3 system-ui, sans-serif; color: var(--ask-plasma); }
  .section { max-width: 1180px; margin: 22px auto 0; padding: 0 16px; }
  .section > h3 { margin: 0 0 4px; font: 700 15px/1.3 system-ui, sans-serif; color: var(--ask-ink); }
  .section > p { margin: 0 0 10px; font: 14px/1.5 system-ui, sans-serif; color: var(--ask-muted); max-width: 92ch; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 860px) { .pair { grid-template-columns: 1fr; } }
  .side > .lab { font: 700 12px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ask-muted); margin: 0 0 6px; }
  .side > .cap { font: 13px/1.5 system-ui, sans-serif; color: #6f75b8; margin: 8px 0 0; }
  .after > .lab { color: var(--ask-green); }

  /* Functional part */
  .flow { display: grid; gap: 8px; padding: 14px 16px; background: var(--ask-sunk); border: 1px solid var(--ask-line); border-radius: 12px;
    font: 14px/1.5 var(--ask-mono); color: var(--ask-ink); }
  .flow .dim { color: var(--ask-muted); }
  .flow .ok { color: var(--ask-green); }
  .flow .no { color: var(--ask-red); }
  .flow .hl { color: var(--ask-plasma); }

  /* The page area, as the app draws it under its top bar (the app shell is its own shared screen). */
  .frame { background: var(--ask-ground); border: 1px solid var(--ask-line); border-radius: 12px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--ask-surface); border-bottom: 2px solid var(--ask-line-strong);
    font: 600 14px/1.3 var(--ask-body); color: var(--ask-muted); }
  .bar b { color: var(--ask-ink); }
  .page { padding: 20px; display: grid; gap: 14px; }
  .page h1 { margin: 0; font-size: 22px; line-height: 1.25; }
  .lede { margin: 0; color: var(--ask-muted); font-size: 15px; }
  a { color: var(--ask-cyan); text-underline-offset: 3px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ask-line); }
  .tab { padding: 6px 12px; font-size: 15px; color: var(--ask-muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--ask-ink); border-bottom-color: var(--ask-plasma); }
  .count { font: 600 12px/1 var(--ask-mono); padding: 2px 6px; border-radius: 999px; background: var(--ask-plasma-soft); color: var(--ask-ink); margin-left: 4px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--ask-muted); }
  .select { padding: 4px 10px; border: 1px solid var(--ask-line-strong); border-radius: 8px; background: var(--ask-surface); color: var(--ask-ink); }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; background: var(--ask-surface);
    border: 1px solid var(--ask-line-strong); border-radius: 10px; }
  .row .t { font-size: 16px; }
  .row .m { grid-column: 1 / -1; font-size: 13px; color: var(--ask-muted); }
  .chip { display: inline-block; padding: 1px 8px; border: 1px solid var(--ask-line-strong); border-radius: 6px; font: 500 12px/1.6 var(--ask-mono); color: var(--ask-ink); white-space: nowrap; }
  .chip.you { border-color: var(--ask-plasma); color: var(--ask-plasma); }
  .chip.ok { border-color: var(--ask-green); color: var(--ask-green); }
  .chip.no { border-color: var(--ask-red); color: var(--ask-red); }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--ask-line-strong); color: var(--ask-ink); background: transparent; font: 600 14px/1.3 var(--ask-body); }
  .btn.primary { background: var(--ask-plasma); color: var(--ask-on-plasma); border-color: var(--ask-plasma); }
  .btn.off { color: var(--ask-muted); border-style: dashed; }
  .empty { padding: 18px; text-align: center; color: var(--ask-muted); border: 1px dashed var(--ask-line-strong); border-radius: 10px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--ask-line); vertical-align: top; }
  th { color: var(--ask-muted); font-weight: 600; font-size: 13px; }
  td code, .mono { font: 500 13px/1.5 var(--ask-mono); }
  .refuse { padding: 10px 12px; border: 1px solid var(--ask-red); border-radius: 10px; color: var(--ask-ink); font-size: 14px; }
  .refuse b { color: var(--ask-red); }
  .ladder { display: grid; grid-template-columns: 9em repeat(5, 1fr); gap: 4px; font-size: 13px; align-items: center; }
  .ladder .c { height: 14px; border-radius: 3px; background: var(--ask-sunk); border: 1px solid var(--ask-line); }
  .ladder .c.on { background: var(--ask-green); border-color: var(--ask-green); }
</style>
</head>
<body>
<div class="section">
<div class="frame" data-screen="bug-record">
        <div class="bar"><b>mobile-B74</b> · Mobile</div>
        <div class="page">
          <h1>Photo upload stuck at 99%</h1>
          <table><tr><th>order</th><th>repository</th><th>pull request</th><th>state</th></tr>
            <tr><td>1</td><td>vertuo-api</td><td><code>api#301</code></td><td><span class="chip ok">merged</span></td></tr>
            <tr><td>2</td><td>vertuo-mobile</td><td><code>mobile#86</code></td><td><span class="chip">open</span></td></tr></table>
          <p class="lede">Ships on the last merge.</p>
          <p class="lede"><span class="chip no">unmatched</span> web#230</p>
          <a class="btn primary" data-primary href="#">Open mobile#86</a>
        </div>
      </div>
</div>
</body>
</html>
