<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business settings mockup</title>
<style>
  :root {
    --ask-ground: #07061c; --ask-surface: #120f3a; --ask-line: #1a2170; --ask-line-strong: #5a60c4;
    --ask-ink: #f2f4ff; --ask-muted: #8a90d6; --ask-plasma: #ffd84a; --ask-on-plasma: #07061c; --ask-cyan: #5ee7ff;
    --ask-body: "Atkinson Hyperlegible Next", system-ui, sans-serif; --ask-mono: ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #03020f; color: var(--ask-ink); font: 16px/1.6 var(--ask-body); }
  .doc { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  .doc > h1 { margin: 0 0 4px; font-size: 28px; }
  .doc > h2 { margin: 48px 0 8px; font-size: 22px; border-bottom: 1px solid var(--ask-line-strong); padding-bottom: 6px; }
  .doc > h3 { margin: 28px 0 8px; font-size: 17px; color: var(--ask-cyan); }
  .lede, .cap { color: var(--ask-muted); }
  .cap { font-size: 14px; margin: 8px 0 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .pair > div > h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ask-muted); }
  .pair > div:last-child > h4 { color: var(--ask-plasma); }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }

  /* flow */
  .flow { display: grid; gap: 10px; }
  .box { padding: 10px 14px; border: 1px solid var(--ask-line-strong); border-radius: 10px; background: var(--ask-surface); }
  .box b { display: block; }
  .box small { color: var(--ask-muted); }
  .box.home { border-color: var(--ask-plasma); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tags span { font-size: 13px; padding: 2px 8px; border: 1px solid var(--ask-line-strong); border-radius: 999px; }
  .gone { text-decoration: line-through; color: var(--ask-muted); }

  /* screens */
  .screen { background: var(--ask-ground); border: 1px solid var(--ask-line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; font-size: 14px; }
  .card { padding: 14px 16px; background: var(--ask-surface); border: 1px solid var(--ask-line-strong); border-radius: 12px; }
  .card h5 { margin: 0 0 4px; font-size: 18px; }
  .muted { color: var(--ask-muted); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs a { padding: 4px 10px; border: 1px solid var(--ask-line); border-radius: 8px; color: var(--ask-ink); text-decoration: none; font-size: 13px; }
  .tabs a[aria-current] { border-color: var(--ask-plasma); color: var(--ask-plasma); }
  .tabs.sub a { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 8px; }
  .tabs.sub a[aria-current] { border-bottom-color: var(--ask-plasma); }
  .tabs .n { color: var(--ask-muted); margin-left: 4px; }
  .row { display: grid; grid-template-columns: 6rem 1fr 1fr auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--ask-line-strong); border-radius: 10px; }
  .fake { padding: 4px 8px; border: 1px solid var(--ask-line-strong); border-radius: 6px; white-space: nowrap; overflow: hidden; max-width: 7rem; }
  button { padding: 5px 12px; border: 1px solid var(--ask-line-strong); border-radius: 8px; background: transparent; color: var(--ask-ink); font: inherit; font-size: 13px; }
  button.primary { background: var(--ask-plasma); color: var(--ask-on-plasma); border-color: var(--ask-plasma); font-weight: 700; }
  .id { font: 700 12px/1.2 var(--ask-mono); color: var(--ask-cyan); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--ask-line); vertical-align: top; }
  th a { color: var(--ask-muted); text-decoration: none; font-weight: 600; font-size: 12px; }
  th[aria-sort] a { color: var(--ask-plasma); }
  td.clip { max-width: 14rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover td { background: var(--ask-surface); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 8px; border: 1px solid var(--ask-line-strong); border-radius: 999px; }
  .chip.on { border-color: var(--ask-plasma); color: var(--ask-plasma); }
  dl { margin: 0; display: grid; grid-template-columns: 8rem 1fr; gap: 6px 12px; }
  dt { color: var(--ask-muted); }
  dd { margin: 0; }
</style>
</head>
<body>
<main class="doc">
<div class="screen" data-screen="business-settings">
        <div class="card"><b>Products</b><p style="margin:8px 0 0"></p><button>+ Add a product</button></div>
        <div class="card"><b>Agent questions</b></div>
        <div class="card"><b>Connect an agent</b> <button class="primary" data-primary>Connect</button></div>
      </div>
</main>
</body>
</html>
