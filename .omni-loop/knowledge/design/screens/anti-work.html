<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anti-work mockup</title>
<style>
body { margin: 0; padding: 24px 16px; background: #07061c; color: #f2f4ff; font: 15px/1.5 system-ui, sans-serif; }
.mock { --ground:#07061c; --surface:#120f3a; --sunk:#0e0d33; --mline:#1a2170; --mlineStrong:#5a60c4; --ink:#f2f4ff; --mmuted:#8a90d6; --plasma:#ffd84a; --plasmaSoft:#2a2350; --onPlasma:#07061c; --cyan:#6ff0ff; --ring:#6ff0ff;
  border:1px solid var(--mline); background:var(--ground); color:var(--ink); border-radius:8px; overflow:hidden; display:grid; grid-template-columns:150px 1fr; font-size:13px; }
.mock.anti { --mline:#3a1458; --mlineStrong:#b0489a; --plasma:#ff3ea5; --plasmaSoft:#3a1238; --onPlasma:#07061c; --ring:#ff3ea5; }
.mock .bar { grid-column:1/3; display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border-bottom:1px solid var(--mline); flex-wrap:wrap; }
.mock .trail { color:var(--mmuted); font-size:12px; }
.mock .ctl { font-size:12px; padding:4px 8px; border-radius:6px; border:1px solid var(--mlineStrong); color:var(--ink); }
.mock .ctl.go { background:var(--plasma); color:var(--onPlasma); border-color:var(--plasma); font-weight:600; }
.mock .ctls { margin-left:auto; display:flex; gap:6px; }
.mock nav { background:var(--sunk); border-right:1px solid var(--mline); padding:8px 6px; min-height:220px; display:flex; flex-direction:column; }
.mock .logo { display:flex; align-items:center; gap:6px; font:700 11px/1 ui-monospace, monospace; letter-spacing:.08em; margin:2px 6px 10px; }
.mock .crest { width:16px; height:16px; border-radius:50%; border:3px solid var(--ring); border-right-color:#ffd84a; }
.mock.anti .logo { flex-direction:row-reverse; justify-content:flex-end; }
.mock.anti .crest { border-right-color:var(--ring); border-left-color:#ffd84a; }
.mock .g { color:var(--mmuted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin:6px 6px 3px; }
.mock .i { padding:4px 8px; border-radius:5px; }
.mock .i.cur { background:var(--plasmaSoft); box-shadow:inset 3px 0 var(--plasma); }
.mock .foot { margin-top:auto; border-top:1px solid var(--mline); padding-top:6px; }
.mock main { padding:14px; }
.mock main h5 { font-size:15px; margin:0 0 6px; }
.mock main p { color:var(--mmuted); margin:0; max-width:46ch; }
.caption { font-size:12px; color:var(--muted); margin:6px 0 0; }
</style>
</head>
<body>
<div class="mock anti" data-screen="anti-work"><div class="bar"><span class="trail">Anti-loop › Anti-work</span><span class="ctls"><span class="ctl">Theme</span><span class="ctl">Game mode</span><span class="ctl go" data-primary>Omni loop</span></span></div><nav><span class="logo"><span class="crest"></span>ANTI LOOP</span><div class="g">Anti-loop</div><div class="i">Anti-dashboard</div><div class="i cur">Anti-work</div><div class="foot"><div class="i">Settings</div><div class="i">Docs</div></div></nav><main><h5>Anti-work</h5><p>The tech team's harness, architecture and retros.</p><p>Not open yet.</p></main></div>
</body>
</html>
