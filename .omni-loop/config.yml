# This repository's own Omni Loop config — it dogfoods the kit it builds (PRD #3, spec §15).
kit: 1
repo:
  slug: vertuoza/vertuo-omni-loop
  defaultBranch: main
paths:
  # No CLAUDE.md or AGENTS.md at the root; apps/galaxy/AGENTS.md is the arcade's own, scoped to its folder.
  context: []
labels:
  autoCreate: false
commands:
  preflight: pnpm test
  preflightFull: pnpm test
  test: pnpm test
laws:
  source: none
# Ask mode (PRD #71, ADR-0002): questions answered on the page the galaxy app serves. The Vercel
# project's default production address; `null` switches the mode off.
ask:
  url: https://vertuo-omni-loop-galaxy.vercel.app
# PRD dossiers (PRD 216): `omni dossier` sends each PRD's spec, plan and before/after page to the same
# app, which keeps every version. Off by default in the kit; `false` stops every upload from here.
dossier:
  enabled: true
# Release notes (PRD 262): every PRD the loop ships carries a `release.md` in its folder, written at
# ship by /omni:yolo and /omni:yolo-fix; `omni ship` refuses one without it. Off by default in the kit.
releaseNotes:
  enabled: true
