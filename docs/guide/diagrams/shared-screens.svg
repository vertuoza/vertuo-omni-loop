<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 384" width="840" height="384">
  <title>Shared screens and what holds a change</title>
  <desc>Shared screens, what can hold a change, and the before/after's two parts. On the left, a page, quote-list: its implements are its own files, and it lists the app shell's files in reads, so its lock trips only on a change to its own implements and a change to the shell never trips it; a screen with no kind is a page. In the middle, a shared screen, app-shell, with kind: shared: structure many pages show, such as an app shell, a notifications bell or a sign-in page, with its own implements, mockup, lock, review and group in the gallery, its routes naming the pages it appears on. On the right, Seen, not touched: when /omni:pixel-perfect review sees a fault in a part the change did not touch, it reports it apart under its own heading, never against the work, never a block, never an outbox item, and suggests it as a bug of its own. Below, the before/after page in two parts: Functional, what the change does, today beside after, which every PRD has; then Pixel perfect, naming the screens it changes, such as screens: quote-list · app-shell, or the one line Pixel perfect: no screen changes. The feature pull request carries a Pixel perfect line naming those screens, or none, in which case no slice runs a review, a mockup or a word pass.</desc>
  <!-- Shown in the guide as the drawing itself: docs.css paints the dg-* classes with the theme's
       tokens, and this <style> is left out (apps/galaxy/src/docs/diagrams.ts). It serves GitHub. -->
  <style>
    svg { background: #f5f4fc; }
    text { font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 14px; fill: #17153d; }
    .dg-px { font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 10px; }
    .dg-tag { font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 8px; }
    .dg-small { font-size: 12.5px; }
    .dg-code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; }
    .dg-muted { fill: #4f5486; }
    .dg-box { fill: #ffffff; stroke: #85819f; stroke-width: 2; }
    .dg-shadow { fill: #85819f; }
    .dg-line { fill: none; stroke: #85819f; stroke-width: 2; }
    .dg-dash { stroke-dasharray: 6 5; }
    .dg-head { fill: #85819f; }
    .dg-edge-you { stroke: #6a2fd0; }
    .dg-key { fill: #efe7ff; stroke: #6a2fd0; }
    .dg-edge-agents { stroke: #0b6f86; }
    .dg-edge-app { stroke: #15703f; }
    .dg-you { fill: #6a2fd0; }
    .dg-agents { fill: #0b6f86; }
    .dg-app { fill: #15703f; }
    @media (prefers-color-scheme: dark) {
