  <text x="95" y="218" class="dg-small dg-muted" text-anchor="middle">screenshot, critique,</text>
  <text x="95" y="234" class="dg-small dg-muted" text-anchor="middle">fix what it touched</text>
  <path d="M173 210 L188.0 210.0" class="dg-line"/>
  <polygon points="197,210 188.0,215.5 188.0,204.5" class="dg-head"/>
  <rect x="203" y="181" width="150" height="64" class="dg-shadow"/>
  <rect x="200" y="178" width="150" height="64" class="dg-box"/>
  <text x="275" y="200" class="dg-code" text-anchor="middle">round 2</text>
  <text x="275" y="218" class="dg-small dg-muted" text-anchor="middle">only what round 1</text>
  <text x="275" y="234" class="dg-small dg-muted" text-anchor="middle">changed</text>
  <path d="M353 210 L368.0 210.0" class="dg-line"/>
  <polygon points="377,210 368.0,215.5 368.0,204.5" class="dg-head"/>
  <rect x="383" y="181" width="150" height="64" class="dg-shadow"/>
  <rect x="380" y="178" width="150" height="64" class="dg-box"/>
