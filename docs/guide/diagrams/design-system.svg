  <text x="455" y="218" class="dg-small dg-muted" text-anchor="middle">the last one,</text>
  <text x="455" y="234" class="dg-small dg-muted" text-anchor="middle">whatever it shows</text>
  <path d="M533 210 L548.0 210.0" class="dg-line"/>
  <polygon points="557,210 548.0,215.5 548.0,204.5" class="dg-head"/>
  <rect x="563" y="181" width="180" height="64" class="dg-shadow"/>
  <rect x="560" y="178" width="180" height="64" class="dg-box"/>
  <text x="650" y="200" class="dg-code" text-anchor="middle">omni design parts</text>
  <text x="650" y="216" class="dg-code" text-anchor="middle">--check &lt;base&gt;</text>
  <text x="650" y="234" class="dg-small dg-muted" text-anchor="middle">on the slice's diff</text>
  <text x="20" y="264" class="dg-small dg-muted">A round that finds nothing ends the review. Untouched parts: Seen, not touched.</text>
  <path d="M600 245 L600 280 L230 280" class="dg-line dg-edge-agents"/>
  <path d="M230 280 L230.0 297.0" class="dg-line dg-edge-agents"/>
  <polygon points="230,306 224.5,297.0 235.5,297.0" class="dg-head dg-agents"/>
  <path d="M700 245 L700.0 309.0" class="dg-line dg-dash"/>
  <polygon points="700,318 694.5,309.0 705.5,309.0" class="dg-head"/>
  <text x="690" y="300" class="dg-small dg-muted" text-anchor="end">each new part off the list</text>
  <text x="20" y="300" class="dg-tag">THE SUB-PR</text>
  <rect x="23" y="313" width="440" height="94" class="dg-shadow"/>
  <rect x="20" y="310" width="440" height="94" class="dg-box"/>
  <text x="36" y="334" class="dg-code">## Design review</text>
  <text x="36" y="354" class="dg-small dg-muted">… critique, audit, lint, screenshots, polish</text>
  <text x="36" y="373" class="dg-small">✓ Rounds — 2 of 3: round 2 found nothing</text>
  <text x="36" y="392" class="dg-small">✗ Parts — Stepper: not on the list (medium item)</text>
  <rect x="507" y="329" width="236" height="64" class="dg-shadow"/>
  <rect x="504" y="326" width="236" height="64" class="dg-box dg-key"/>
  <text x="622" y="348" class="dg-small dg-you" text-anchor="middle">the PRD's outbox</text>
  <text x="622" y="366" class="dg-small" text-anchor="middle">add Stepper to DESIGN.md?</text>
  <text x="622" y="382" class="dg-small dg-muted" text-anchor="middle">one medium item per part</text>
  <text x="20" y="436" class="dg-small dg-muted">Never blocking: a new part is a question you answer, never a stop. With no DESIGN.md, nothing new is read.</text>
</svg>
