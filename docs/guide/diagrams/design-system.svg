  <text x="375" y="76" class="dg-small dg-muted" text-anchor="middle">on each ui: yes slice</text>
  <text x="375" y="92" class="dg-code" text-anchor="middle">Parts: Button, DataTable</text>
  <text x="375" y="108" class="dg-code" text-anchor="middle">Reference screen: quote-list</text>
  <path d="M488 76 L518.0 76.0" class="dg-line dg-edge-agents"/>
