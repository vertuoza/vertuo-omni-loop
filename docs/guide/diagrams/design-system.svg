<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452">
  <title>A UI slice built from DESIGN.md</title>
  <desc>A UI slice, from DESIGN.md to the Design review. DESIGN.md holds the semantic tokens, a closed list of parts and its reference screens. /omni:plan writes on each ui: yes slice the parts it uses and the reference screen it copies. /omni:do-work reads them, and that screen's file and mockup, before it builds, and builds from listed parts and semantic tokens. /omni:pixel-perfect review then runs up to three rounds of screenshot, critique against DESIGN.md and the reference screen, and fix; each round fixes only what the slice touched, a round that finds nothing ends it, and a fault in an untouched part goes under Seen, not touched. Then omni design parts --check runs on the slice's diff: each new part not on the list raises one medium outbox item, add it to DESIGN.md?. The sub-PR's Design review gains a Rounds line and a Parts line. Nothing blocks, and with no DESIGN.md nothing new is read.</desc>
  <!-- Shown in the guide as the drawing itself: docs.css paints the dg-* classes with the theme's
       tokens, and this <style> is left out (apps/galaxy/src/docs/diagrams.ts). It serves GitHub. -->
  <style>
