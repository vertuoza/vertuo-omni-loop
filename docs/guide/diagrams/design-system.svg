  <rect x="20" y="34" width="200" height="84" class="dg-box dg-key"/>
  <text x="120" y="56" class="dg-code dg-you" text-anchor="middle">DESIGN.md</text>
  <text x="120" y="76" class="dg-small dg-muted" text-anchor="middle">semantic tokens</text>
  <text x="120" y="92" class="dg-small dg-muted" text-anchor="middle">a closed list of parts</text>
  <text x="120" y="108" class="dg-small dg-muted" text-anchor="middle">its reference screens</text>
  <path d="M223 76 L253.0 76.0" class="dg-line dg-edge-agents"/>
  <polygon points="262,76 253.0,81.5 253.0,70.5" class="dg-head dg-agents"/>
  <rect x="268" y="37" width="220" height="84" class="dg-shadow"/>
