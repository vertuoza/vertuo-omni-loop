# The omni-loop GitHub App manifest (PRD 28). An org admin registers the app from this file. It is
# public (PRD 359): anyone can install it on the repositories they pick, and installing it is how a
# workspace is born. After an installation (or an install request) GitHub sends the installer to
# `setup_url`, galaxy's `/signup/installed`, which checks the installation and creates the workspace.
# On a repository without `.omni-loop/config.yml` the app posts nothing.
#
# Least privilege: these permissions and events are what the outbox check and the retro use, nothing
# more. `test/app-yml.test.ts` fails on any permission or event beyond them. The retro (PRD 72)
# widened them once: `contents: write` (was `read`) to write its own `branches.retro` branch,
# `issues: write` for its retro issues and `actions: read` for failed jobs' logs. The actions the app
# acts on (pull_request: opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited,
# closed; check_run: rerequested, and requested_action for the canon gate's two buttons, PRD 839) are
# filtered in `src/webhook/` — a manifest subscribes to whole events.
#
# `url` and the webhook point at the app's Vercel project, `setup_url` at galaxy's; replace a host with
# its project's production domain before registering if it differs.
name: omni-loop
description: Posts the omni-loop outbox check on every pull request, and a retro after every feature pull request merges.
url: https://omni-loop.vercel.app
public: true
setup_url: https://vertuo-omni-loop-galaxy.vercel.app/signup/installed
hook_attributes:
  url: https://omni-loop.vercel.app/api/github
  active: true
default_permissions:
  checks: write
  contents: write
  pull_requests: write
  metadata: read
  issues: write
  actions: read
default_events:
  - pull_request
  - check_run
