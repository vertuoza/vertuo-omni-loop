# The checks of a ready pull request into main (PRD 598): `test` runs `pnpm test`, `typecheck` runs
# `pnpm typecheck` (PRD 725), `lint` runs `pnpm lint` (PRD 976) and `fallow` runs `pnpm fallow:audit`, each against
# its own gate, side by side. `test` and `lint` each run as shards (PRD 1042), gathered into one check
# of that name; scripts/checks-workflow.test.ts holds that shape. A draft runs nothing, and neither does
# a sub-PR into a feature branch (its base is not main) nor a pull request that changes only docs.
# Marking a feature PR ready is what grades it, then every push after.
#
# `settle` waits first (scripts/settle-head.sh carries the numbers): a newer push cancels this run
# while it is still one idle runner (the concurrency group below), and a branch that moved anyway
# makes the run stale, so `test`, `typecheck`, `lint` and `fallow` (and their shards) skip. A burst of pushes costs one full run.
#
# A phase-0 PR (head `docs/phase-0-<topic>`, `branches.phase0` in .omni-loop/config.yml) carries only a
# PRD's docs: `settle` does not run for it, so neither do `test`, `typecheck`, `lint` and `fallow` (PRD 675). The omni-loop
# App's inbox check grades it instead.
name: checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
# A draft run has a group of its own (issue 1167): a push and `gh pr ready` seconds apart start a
# draft `synchronize` run, which runs nothing, beside the `ready_for_review` run, and in one shared
# group either could cancel the other, leaving the ready PR green with no check run at all.
concurrency:
  group: checks-${{ github.head_ref }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true
jobs:
  settle:
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'docs/phase-0-')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      stale: ${{ steps.gate.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SETTLE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/settle-head.sh

  # `pnpm test` in 3 shards side by side (PRD 1042): each runs a third of the files through vitest's own
  # `--shard`, and none cancels another, so every failure shows.
  test-shard:
    name: test shard ${{ matrix.shard }}/3
    needs: settle
    if: needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3

  # The one `test` check, gathered from its shards: green only when every shard passed. `always()` runs
  # it after a failed shard, to fail itself; a stale settle still skips it, as it skips the shards.
  test:
    needs: [settle, test-shard]
    if: always() && needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: '[ "${{ needs.test-shard.result }}" = "success" ] || { echo "a test shard did not pass: ${{ needs.test-shard.result }}"; exit 1; }'

  # `pnpm typecheck`: `tsgo` over the root project and the arcade (PRD 725, PRD 1042; `pnpm typecheck:tsc` is the `tsc` fallback); the arcade's docs index is generated first,
  # since only its build made it before.
  typecheck:
    needs: settle
    if: needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # typescript-eslint's strictTypeChecked over every TypeScript file git tracks (PRD 976), failing on
  # any finding at all, in 2 shards side by side (PRD 1042): `--shard <i>/<n>` lints every n-th file.
  lint-shard:
    name: lint shard ${{ matrix.shard }}/2
    needs: settle
    if: needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --shard ${{ matrix.shard }}/2

  # The one `lint` check, gathered from its shards the same way as `test`.
  lint:
    needs: [settle, lint-shard]
    if: always() && needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: '[ "${{ needs.lint-shard.result }}" = "success" ] || { echo "a lint shard did not pass: ${{ needs.lint-shard.result }}"; exit 1; }'

  fallow:
    needs: settle
    if: needs.settle.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The audit grades only what this pull request changes, measured from its base.
      FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fallow:audit
