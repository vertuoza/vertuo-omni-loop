# The game layer's only writer: polls the delivery layer and appends to the ledger in Supabase, records
# who authored each merge into a default branch and each PRD issue (public.contributions), fills the
# PRD dossiers from each repository's delivery folders, and once a week posts the rankings and
# keeps a backup. It commits nothing to the repository. Delete this file and game/ to remove the game
# (spec §2).
# Setup (token scopes, Supabase, variables): game/README.md, "Setup".
name: game
on:
  schedule:
    - cron: '*/15 * * * *'     # poll
    - cron: '0 7 * * 1'        # Monday 09:00 Brussels (07:00 UTC in summer; 08:00 in winter is fine)
  workflow_dispatch:
    inputs:
      post_rankings:
        description: Also post the rankings page to the pinned issue
        type: boolean
        default: false
permissions:
  contents: read
env:
  # The workspace every game script reads and writes: they have no default. One workspace per run
  # until each workspace polls with its own installation token.
  OMNI_LOOP_WORKSPACE: vertuoza
jobs:
  ledger:
    # Every schedule and every dispatch. Off until the repository variable GAME_ENABLED is 'true'.
    if: vars.GAME_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: game-ledger          # two polls never append together
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # The ledger, the sectors, the fleets and the roster live in Supabase; the service role reads
      # them and appends. Set up in apps/galaxy/README.md, "Deploy to production".
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm game:project
        env: { GH_TOKEN: '${{ secrets.OMNI_GAME_TOKEN }}' }   # contents, pull requests and issues: read on the engineering repos
      # Every login's XP, level and unlocked games, recomputed from the whole ledger with the rulebook
      # of the day and written to player_xp. Reads the ledger, never writes it.
      - run: pnpm game:xp
      # Who authored each pull request merged into a sector repository's default branch, and who
      # opened each omni:prd issue, over the last 40 days, upserted into public.contributions for the
      # app's dashboard (PRD 328). Never writes the ledger. It skips and logs a repository it cannot
      # read, and never fails the job.
      - run: pnpm game:contributions
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.OMNI_GAME_TOKEN }}' }   # pull requests and issues: read on the engineering repos
      # PRD dossiers' fallback (PRD 216): each repository's delivery folders on its default branch,
      # read into the dossiers of the PRDs they hold, a version wherever a file changed. It skips and
      # logs what it cannot read, and never fails the job.
      - run: pnpm game:dossiers
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.OMNI_GAME_TOKEN }}' }   # contents: read on the engineering repos

  rankings:
    # The Monday schedule, or a dispatch that asks for it. Reads the ledger; writes nothing to the
    # repository or the database.
    if: >-
      vars.GAME_ENABLED == 'true' &&
      (github.event.schedule == '0 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.post_rankings))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: game-rankings
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      RANKINGS_ISSUE: ${{ vars.RANKINGS_ISSUE }}   # the pinned "Hall of Heroes" issue number
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Back up the game database
        # The fleet stamps on ledger events cannot be rebuilt from GitHub: this export restores them.
        run: pnpm game:export "$RUNNER_TEMP/omni-loop-backup"
      - uses: actions/upload-artifact@v4
        with:
          name: omni-loop-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/omni-loop-backup
          retention-days: 90
      - run: pnpm game:score --rankings "$RUNNER_TEMP/rankings.md"   # in the first 7 days of a month, last month's final standings
      - name: Post the rankings
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if [ -z "$RANKINGS_ISSUE" ]; then echo '::error::set the repository variable RANKINGS_ISSUE'; exit 1; fi
          gh issue comment "$RANKINGS_ISSUE" --body-file "$RUNNER_TEMP/rankings.md"
