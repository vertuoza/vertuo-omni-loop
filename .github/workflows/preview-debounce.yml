# The Vercel previews of a ready pull request into main (PRD 1646). Vercel's own Git deployments of a
# branch are skipped by scripts/vercel-ignore.sh; this workflow is how a preview gets built. Once a
# pull request is ready (and after each push to it), scripts/preview-debounce.sh waits for its pushes
# to settle, then, for each project its files reach, adds the check run vercel/preview/<project> to
# the head commit and asks Vercel to build that commit from Git. A newer push cancels a run still waiting (the
# concurrency group), so a burst of agent pushes builds one preview. Drafts, pull requests into a
# feature branch (slices, landings) and dependabot never preview.
#
# A draft labelled `omni:ready-check` (PRD 2898) previews as a ready pull request does: once the
# label is added and after each push, so the e2e job of the `checks` workflow has the preview of the
# draft's latest commit to run on. Marking that draft ready builds nothing more (its latest commit has
# its preview), and adding any other label builds nothing and cancels nothing: such a run is alone
# in a group named by its run id. The gate is one expression, written twice below, which
# scripts/preview-debounce.test.ts evaluates event by event.
#
# Needs the secrets VERCEL_TOKEN, VERCEL_TEAM_ID, VERCEL_PROJECT_ID_GALAXY, VERCEL_PROJECT_ID_OMNI_APP
# and the variable VERCEL_GITHUB_REPO_ID (the spec's Dashboard steps): without them a run that has a
# preview to build fails, red on the pull request.
name: preview-debounce
on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, labeled]
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: >-
    preview-${{ github.head_ref }}-${{
    (github.event.action == 'labeled' && github.event.label.name == 'omni:ready-check' && github.event.pull_request.draft
    || github.event.action == 'ready_for_review' && !contains(github.event.pull_request.labels.*.name, 'omni:ready-check')
    || github.event.action == 'synchronize' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'omni:ready-check')))
    && 'ready'
    || github.run_id }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      ${{ !startsWith(github.head_ref, 'dependabot/')
      && (github.event.action == 'labeled' && github.event.label.name == 'omni:ready-check' && github.event.pull_request.draft
      || github.event.action == 'ready_for_review' && !contains(github.event.pull_request.labels.*.name, 'omni:ready-check')
      || github.event.action == 'synchronize' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'omni:ready-check'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - env:
          GH_TOKEN: ${{ github.token }}
          DEBOUNCE_PR: ${{ github.event.pull_request.number }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID_GALAXY: ${{ secrets.VERCEL_PROJECT_ID_GALAXY }}
          VERCEL_PROJECT_ID_OMNI_APP: ${{ secrets.VERCEL_PROJECT_ID_OMNI_APP }}
          VERCEL_GITHUB_REPO_ID: ${{ vars.VERCEL_GITHUB_REPO_ID }}
        run: bash scripts/preview-debounce.sh
