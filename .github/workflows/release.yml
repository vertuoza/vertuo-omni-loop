# The kit's release (PRD 347): every push to main cuts the next version, v0.0.1, v0.0.2, … The logic
# lives in kit/release/release.ts, with its tests; this workflow only checks out main with its whole
# history and tags, installs, and calls it. The script stamps the version in package.json, plugin.json
# and the bundle, commits them to main as `chore(release): v0.0.N`, tags it and publishes the GitHub
# Release with the bundle attached. That commit is the one push to main a person does not make (the
# briefing's Never section). A push whose head is a release commit cuts nothing.
# main is protected by a ruleset (test, typecheck, lint and fallow must pass) that only the deploy key
# RELEASE_DEPLOY_KEY may bypass: the checkout below uses it, so this push, and no other, goes through.
# Vercel deploys main from the release commit and skips the merge before it (PRD 1646,
# scripts/vercel-ignore.sh): when this run fails or is cancelled, no release commit comes, so its last
# step marks main's head vercel/production-fallback and calls each project's Deploy Hook for main.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release              # one release at a time, and a queued one is never cancelled
      cancel-in-progress: false
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        # main as it is now, not the commit that started the run: a queued run releases what the
        # runs before it left.
        with: { ref: main, fetch-depth: 0, fetch-tags: true, ssh-key: '${{ secrets.RELEASE_DEPLOY_KEY }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node kit/release/release.ts
      # PRD 1646: the release did not land, so Vercel would skip this merge. Mark main's head so the
      # ignore step builds it, then ask each project for a deployment of main.
      - name: deploy main through the Vercel Deploy Hooks
        if: failure() || cancelled()
        env:
          HOOK_GALAXY: ${{ secrets.VERCEL_DEPLOY_HOOK_GALAXY_MAIN }}
          HOOK_OMNI_APP: ${{ secrets.VERCEL_DEPLOY_HOOK_OMNI_APP_MAIN }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)" || head="${{ github.sha }}"
          gh api -X POST "repos/${{ github.repository }}/statuses/$head" -f state=success \
            -f context=vercel/production-fallback -f description="the release did not land: deploy this commit" >/dev/null \
            || echo "::warning::could not mark $head vercel/production-fallback"
          for hook in "$HOOK_GALAXY" "$HOOK_OMNI_APP"; do
            if [ -z "$hook" ]; then echo "::warning::a Vercel Deploy Hook secret is not set"; continue; fi
            curl -sf -X POST "$hook" >/dev/null || echo "::warning::a Vercel Deploy Hook call failed"
          done
