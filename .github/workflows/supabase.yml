# The galaxy database. On a pull request: every migration and the demo seed apply to an empty
# database, and supabase/checks/access.sql proves who may read and write what. On main: the
# migrations are applied to the production project. Off until the repository variable SUPABASE_PROJECT_ID is set.
# Setup (project, secrets, variables): apps/galaxy/README.md, "Deploy to production".
name: supabase
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # pinned: `latest` asks the GitHub API, which rate-limits
      - run: supabase db start      # applies supabase/migrations, then supabase/seed.sql
      - name: Who may read and write the galaxy
        # Signed out: nothing. A member of a workspace: that workspace's galaxy and nothing of another,
        # and only their own player row, never their GitHub login. Joining by domain: a confirmed
        # address only. The service role: appends, never rewrites. The hook: refuses a domain no
        # workspace joins. The migrations grant all of this themselves (config.toml › auto_expose_new_tables = false).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/access.sql

  deploy:
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-production    # two pushes never migrate together
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}   # a personal access token of the Supabase org
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}     # the production database password
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # pinned: `latest` asks the GitHub API, which rate-limits
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      - run: supabase db push       # migrations only; the demo seed never reaches production
