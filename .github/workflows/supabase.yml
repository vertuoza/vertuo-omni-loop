# The galaxy database. On a pull request: every migration and the demo seed apply to an empty
# database, supabase/database.types.ts is what they generate (PRD 725), every read a module registers
# in a `*.boundary.ts` parses with its schema (PRD 1030), and supabase/checks/access.sql
# proves who may read and write what. On main: the
# migrations are applied to the production project. Off until the repository variable SUPABASE_PROJECT_ID is set.
# Setup (project, secrets, variables): apps/galaxy/README.md, "Deploy to production".
name: supabase
on:
  pull_request:
    # The source of the arcade and the App too, where the schemas `pnpm schemas:verify` parses with
    # live beside their modules: a change to a schema always runs it (PRD 1030).
    paths:
      - 'supabase/**'
      - 'scripts/supabase-types.ts'
      - 'scripts/schemas-verify.ts'
      - '**/*.boundary.ts'
      - 'apps/galaxy/src/**'
      - 'apps/omni-app/src/**'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # pinned: `latest` asks the GitHub API, which rate-limits
      # Applies supabase/migrations, then supabase/seed.sql. The database, and the API in front of it
      # with its keys (PostgREST, Kong, Auth), which `pnpm schemas:verify --local` reads through, and none
      # of the services no step uses.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }  # runs the scripts' TypeScript natively (Node >= 22.18)
      - name: Every new migration is dated after the newest on main
        # `supabase db push` refuses a migration dated before the newest one production applied (PRD
        # 1364, 2026-10-11): re-date it after the one this names. main is read as it is now, not as the
        # pull request found it.
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/migration-order.ts --base origin/main
      - run: pnpm install --frozen-lockfile
      - name: The database's types are what the migrations generate
        # `supabase gen types --local`, by the pinned CLI above, against the database just started;
        # fails, naming the first line, when the committed supabase/database.types.ts differs. To
        # refresh it: `supabase db start`, then `node scripts/supabase-types.ts`, and commit the file.
        run: node scripts/supabase-types.ts --check
      - name: Every registered read parses with its module's schema
        # `pnpm schemas:verify --local` (PRD 1030): each `*.boundary.ts` read, the module's own select
        # or rpc, runs against the database just seeded and is parsed with the module's zod schema;
        # it fails naming the module and the zod path of each mismatch, and names each read the seed
        # leaves empty. It only reads.
        run: pnpm schemas:verify --local
      - name: Who may sign up, and how a workspace is born
        # The hook: any GitHub account, with or without an email, and no other provider. Installing
        # the App makes one workspace per GitHub account, its installer the owner; a replay makes
        # nothing. Joining by GitHub org: installed workspaces only. Only the service role runs either
        # function; a person reads only their own sign-up requests.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/signup.sql
      - name: Who may read and write the galaxy
        # Signed out: nothing. A member of a workspace: that workspace's galaxy and nothing of another,
        # and only their own player row, never their GitHub login. Joining by domain: a confirmed
        # address only. The service role: appends, never rewrites. The hook: refuses a domain no
        # workspace joins. The migrations grant all of this themselves (config.toml › auto_expose_new_tables = false).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/access.sql
      - name: Who may read and write the ask sessions
        # Two accounts, each with its own JWT: neither reads, changes or removes the other's ask
        # sessions or rounds. A round only moves forward; the expiry is scheduled and ask-only.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/ask.sql
      - name: Who may read and write the dossiers
        # A member of the workspace reads its dossiers and their versions; an account of another
        # workspace, or of none, nothing. Only dossier_open() and dossier_push() write, and the service
        # role adds versions through the same rule: a version only when its content changed, never
        # rewritten. Only the opener deletes a draft; nobody deletes a numbered dossier.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/dossiers.sql
      - name: The PRD list loads at a real workspace's size
        # A member lists 1400 dossiers, with their versions and 25,200 answered rounds, through
        # dossier_list() as /prd does, inside production's 8 second statement timeout (bug #1308).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/dossier_list_volume.sql
      - name: The PRD list's and a PRD page's lighter reads
        # dossier_list(p_kind) lists only that kind, every kind without it; dossier_repos() gives a
        # dossier's repositories and counts as dossier_list() does, and nothing of another workspace;
        # a plan version keeps its slice count as the kit counts it (PRD 2401 s3).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/dossier_reads.sql
      - name: Membership is read once per statement
        # No policy calls is_member() with a row's column, and a member's count over 10,000 ledger
        # events stays within 2,000 buffers: membership read per row cost 20,928 on production (bug #1832).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/rls_membership_once.sql
      - name: Who may read and write the heartbeats
        # working_ping() upserts the caller's own row and resolves its dossier (a draft, a PRD, a visual
        # or bug fix, or null); another account cannot write it, nobody signed in writes the table, a
        # member of the workspace reads it, and anyone else reads nothing.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/working_pings.sql
      - name: Who may read and write the loops
        # loop_push() opens a loop as its caller, in the repository's workspace, with plan version 1;
        # refuses a second running loop of the caller on that repository, naming it, and takes over a
        # silent one only when asked; appends ticks, adds plan versions, parks PRDs and stops the loop,
        # parked when PRDs still wait. Another account cannot push to it, nobody signed in writes the
        # three tables, a member of the workspace reads them, and anyone else reads nothing (PRD 1139).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/loops.sql
      - name: Who may read and write the roadmaps
        # roadmap_push() files a roadmap in its repository's workspace with its PRDs in order and its
        # product matched by name among the workspace's own; a second push, by any member, replaces its
        # document, questions and PRDs; an unknown product is filed under none and said. Nobody signed
        # in writes the two tables, a roadmap never points at another workspace's product, a member of
        # the workspace reads them, anyone else nothing; a loop's tick keeps its repositories (PRD 1162).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/roadmaps.sql
      - name: Who may read and write the releases
        # Anyone, signed out or signed in, reads every release, and nobody writes one. Only the service
        # role (pnpm releases:sync) adds releases and refreshes their text, and it never renumbers,
        # redates or deletes one. Release 1 is shared; a release above 1 belongs to one PRD.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/releases.sql
      - name: Who may read and write the contributions
        # A member of a workspace reads its contributions and nothing of another; signed out, or in no
        # workspace, nothing. Nobody signed in inserts, updates or deletes one: only the service role
        # (pnpm game:contributions) writes, an upsert on the key that a second run leaves unchanged.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/contributions.sql
      - name: Who may write the fleets
        # Only a workspace's owner creates, restyles, retires and restores its fleets, through the four
        # fleet functions; a member, another workspace's owner and anyone signed out are refused, and
        # nothing changes. Each field is checked at its edges, a refusal names its field, at most 12
        # fleets are active, and a fleet's name is derived once and never changes. Nobody signed in
        # writes public.teams directly. The member whose GitHub login is pierrederval owns vertuoza.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/fleets.sql
      - name: Who may read and write the outbox sends
        # A send is made only by a member of its dossier's workspace, as themselves, and read only by
        # its owner; an account of another workspace, of none, or signed out, nothing. Its outcome is
        # recorded once, by its owner, through outbox_send_done(); nobody updates or deletes a send.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/outbox_sends.sql
      - name: What the dashboards read
        # workspace_roster lists every member of a workspace (no email) and answered_counts counts
        # each member's answered rounds in that workspace's sessions only; both return nothing to a
        # non-member, and neither runs signed out.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/dashboards.sql
      - name: What the game reads of the answered rounds
        # game_answered_rounds returns one workspace's rounds answered since a moment, each with its PRD
        # (brainstorm rule first, then delivery, numbered PRD dossiers only), its home and the
        # answerer's lower-case login; none without a PRD or a login. Only the service role runs it,
        # and the ledger takes QUESTION_ANSWERED (PRD 1180).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/game_answered_rounds.sql
      - name: Who may read and write the PRD stages
        # Only the service role records a PRD's stages and topics, and a second write of a stage keeps
        # its first date. A member reads their own workspace's rows; anyone else reads nothing, and
        # nobody signed in writes.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/prd_stages.sql
      - name: Who may read and write the PRD milestones
        # Only the service role records a PRD's milestones; a second write keeps the first time, but a
        # later last-slice moves it (PRD 2370). A member reads their own workspace's rows; anyone else
        # reads nothing, and nobody signed in writes.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/prd_milestones.sql
      - name: Who may read and write a PRD's main watch, and who decides a rewind finding
        # Only the service role opens a watch per lane, adds its breaks (a replayed source adds nothing)
        # and proposes findings (none without an evidence link, none twice), and never decides one; it
        # may queue /omni:rewind as the app. A member reads their own workspace's rows, writes none, and
        # approves or rejects a finding once through its function, which logs the decision; anyone else
        # reads and decides nothing (PRD 2410).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/main_watch.sql
      - name: Who records an approved rewind finding's outcome, and how often
        # The service role or a member of the finding's workspace records an approved finding's outcome
        # once, through its function: a proposed rule with its pull request, an already said with its
        # rule, a question with its words. A second outcome, a finding not approved, a missing value and
        # anyone else are refused; members read the columns, nobody writes them directly (PRD 2498).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/rewind_outcome.sql
      - name: Who may read and write the PRD outboxes
        # Only the service role records and recounts a PRD's open outbox questions. A member reads
        # their own workspace's rows; anyone else reads nothing, and nobody signed in writes.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/prd_outbox.sql
      - name: Who may read and write the waits
        # Only the service role opens, refreshes and ends a wait; a row keeps its since and its end, a
        # wait has one open row, and an ended one is kept. A member reads their own workspace's rows;
        # anyone else reads nothing, and no other role writes (PRD 2377).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/waits.sql
      - name: Who may read and write the fixes' stored facts
        # Only the service role stores a fix's GitHub facts. A member reads their own workspace's
        # rows; anyone else reads nothing, and nobody signed in writes. A bug's Fixes rows give its
        # facts their summary, whoever writes them (PRD 2011).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/fix_facts.sql
      - name: A product bug's Fixes rows and its counter
        # fix_bug_push() creates mobile-B<n> from the product's own counter, with its rows in order,
        # refusing by name a row outside the product before any write; fix_row_stamp(), the service
        # role's alone, stamps a merge once, a close and a reopen, ships the record on its last merge
        # and keeps an unmatched merge once; a merged row never moves. A member reads the rows, nobody
        # signed in writes them. Two creates at once, through dblink, take two numbers with no gap (PRD 2011).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/fix_rows.sql
      - name: A repository's knowledge packs
        # knowledge_pack_put(), the service role's alone, keeps a repository's knowledge and flow files at a
        # commit in each workspace holding it in a product, each file with its sha256, the latest commit's
        # pack the newest; a path climbing out or a wrong hash is refused whole. A member reads their
        # workspace's packs, nobody signed in writes them, and an agent link of another workspace reads
        # none (law BR-PRODUCT-63, PRD 2011).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/knowledge_packs.sql
      - name: Who may push and read a repository's knowledge graph
        # knowledge_graph_push() keeps one row per repository and commit for a member of a workspace that
        # lists the repository, with their login, and answers their own workspaces' serving products; the
        # same commit again leaves one row holding the second graph, the 21st commit removes the oldest. A
        # stranger, an account of no workspace and a signed-out caller push nothing and read nothing, a
        # malformed value is refused whole, and nobody writes the table directly (PRD 1798).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/knowledge_graphs.sql
      - name: What an agent's link reads of its product's knowledge graph
        # knowledge_graph_for_token() answers a live business link its own product (its repository's only
        # one, or the business's only one) with its links, Legal entries, terms and Never lines, and the
        # latest graph of each link serving its own knowledge, never an imported one's nor another
        # workspace's. A revoked, unknown, kit or ex-member's token reads nothing (28000), another
        # workspace's repository is refused, named (42501), and no single product is one line (22023)
        # (law BR-PRODUCT-63, PRD 1798).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/knowledge_graphs_link.sql
      - name: A product's plan repository and its archive
        # Only an owner sets a product's plan repository, one its workspace lists, and archives it, refused
        # while a repository of the product is below step 5, named; an undo clears it, and an archived plan
        # repository is not changed (PRD 2011).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/products.sql
      - name: Who may read and write the repositories
        # Only a workspace's owner adds a repository or switches its tracking, through the two
        # repository functions; a member, another workspace's owner, a stranger and anyone signed out
        # are refused. Members read the repositories, pull requests and reviews; a stranger reads
        # nothing; nobody writes the three tables directly. vertuoza alone is seeded with six.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/repositories.sql
      - name: A repository in several products
        # PRD 1364: a repository links to any number of products, each link with its own role,
        # knowledge, read-at, read-only and consumes. Only an owner links and unlinks; a self-consume,
        # a consumes outside the product and an imported link without read-at are refused.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_repositories.sql
      - name: A PRD's product
        # PRD 1364: a PRD and an idea carry an optional product, taken at birth from a repository in one
        # product, none in no product, the named one in several; changing it is locked while an approval
        # is in force, and a PRD's product links its repositories.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/prd_product.sql
      - name: A PRD's plan targets
        # PRD 2174: each plan push writes the repositories its Repositories table names, resolved, never
        # the home repository on its own account; a newer plan replaces them; the migration backfills
        # every dossier with a plan; members read their workspace's rows and no client writes one.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/prd_targets.sql
      - name: Which product a lookup finds
        # PRD 1364: every product lookup reads the PRD's own product, then the repository's only
        # product, then none: approvers, claims, personas, constituents and pitch follow it, and a
        # token in a workspace of several products answers with no product instead of failing.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_lookups.sql
      - name: Who may read and write the business
        # Any member of a workspace opens its business, picks, suggests, confirms and rejects claims,
        # adds and renames products, points repositories at them and cites claims, through the business
        # functions only; another workspace's member and anyone signed out are refused (42501), a bad
        # kind or value is refused (22023). Agents read confirmed claims only, region from the business
        # and the rest from the repository's product. Nothing is seeded, and no citation is rewritten.
        # Agents and the App read the product's active Legal entries and live glossary terms (PRD 1795).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/business.sql
      - name: Who may read and write the personas
        # Any member of a workspace adds, edits, deletes and restores its products' personas through the
        # persona functions; another workspace's member and anyone signed out are refused (42501), a bad
        # stance, name, text, trade or avatar is refused (22023, the field in `hint`), and the service role
        # adds through the same checks. A persona follows its product; agents read the product's personas
        # oldest first, [] without, and state still comes from claims. Nothing is seeded.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/personas.sql
      - name: Who may read and write the Jev settings
        # Only a workspace's owner sets and removes its TypeSafe key and sets a decision's mode, threshold
        # and confidence floor, through the three Jev functions; a member, another workspace's owner, a
        # stranger and anyone signed out are refused (42501). Nobody signed in reads a sealed key: a member
        # learns only whether one is stored, the owner its last four. Removing the key sets every decision
        # Off; a decision stays Off without a key. Only the service role reads a key and appends a call.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/jev.sql
      - name: Who may make and revoke an agent's link, and what it reads
        # Any member makes a link for themselves (20 live at most, a name unique among theirs) and lists
        # the workspace's; only its maker or an owner revokes one; another workspace's member and anyone
        # signed out are refused (42501). Only the token's hash and last four are stored, and the list
        # never carries the hash. The link reads exactly what business_for_repo() answers a member for the
        # same repository, the only product without one, never another workspace's repository; a revoked
        # or unknown link, or one whose maker left, is refused (28000). Last used moves once a minute.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/agent_tokens.sql
      - name: What a link reports, and how a member answers it
        # A working link reports a question with its asker, repository and file; the same question (case
        # and spaces aside) bumps one row; over 300 characters, or the 31st report in 24 hours, is refused.
        # Any member answers an open question once as a confirmed claim (source answer) of the picked kind,
        # on the question's product, which the next read through the link carries, or dismisses it with no
        # claim; open questions are counted for the bell. Another workspace's member is refused (42501).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/agent_questions.sql
      - name: Who may read and write the constituents
        # Only a workspace's owner adds, edits and removes its products' Statement and Never lines; a
        # member, another workspace's owner and anyone signed out are refused (42501). Each write logs
        # exactly one event; a removed line keeps its row and id. Members read both tables and the
        # terminal's read; the App's read is the service role's. The move turns confirmed `never`
        # claims into Never lines and leaves the claims rejected.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/constituents.sql
      - name: Who may read and change a product's Legal entries and glossary
        # A workspace owner names each kind's owner and delegate; they add, edit, retire (Legal) or remove
        # (Glossary) directly and approve or reject proposals; while a kind names neither, the workspace's
        # owners do; any other member proposes; anyone else, or signed out, reads and writes nothing
        # (42501, P0002, 22023 with the field in `hint`). A Legal number is never reused, a retired entry
        # and a removed term are kept, a live term is unique without case, every change logs exactly one
        # event, and nobody writes the five tables directly (PRD 1795).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_knowledge.sql
      - name: Who may read and write the GitHub budget
        # The service role keeps ETags and budgets, refreshes them in place, keeps a pause through a
        # refresh and drops old ETags. Nobody signed in, nor signed out, reads or writes either table.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/github_budget.sql
      - name: Who may read and write the GitHub snapshots
        # The service role stores a PRD's snapshot, marks it stale, leases its refresh and refreshes it
        # in place. A member reads their own workspace's snapshots; nobody else reads, nobody signed in
        # writes, and a snapshot goes with its dossier.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/dossier_github.sql
      - name: Who may read and change a product's pitch look
        # Every product starts in arcade. Any member of a workspace (whoever may edit Business) changes
        # one product's look to keynote or back through set_pitch_look(), and its other products keep
        # theirs; another workspace's member, a stranger and anyone signed out are refused (42501), any
        # other look is refused (22023). pitch_look_for_repo() reads the repository's product's look,
        # arcade for a repository with no product. Nobody writes the column directly.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/products_pitch_look.sql
      - name: Who may upload, register and read a PRD's pitches
        # A member of the dossier's workspace uploads a run's five files to the private pitches bucket and
        # registers it through pitch_run_add(), for a PRD at shipped or retro only: an earlier stage and a
        # fix are refused in the bucket and in the call (55000). A file not in the run's folder, another
        # audience or look are refused (22023), a run twice (23505); another workspace's member and a
        # stranger read nothing and register nothing, anyone signed out is refused, and nobody writes the
        # table directly.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/pitch.sql
      - name: Who may read and change a product's Pitch settings and assets
        # A PRD 859 look reads as its preset after the migration. Any member of a workspace changes one
        # product's settings through set_pitch_settings(), its other products keep theirs, and pitch_look
        # follows the preset; a value the kit could never parse is refused (22023), another workspace's
        # member, a stranger and anyone signed out are refused (42501). pitch_settings_for_repo() reads the
        # repository's product's settings, {} for none. A member uploads, replaces, reads and removes their
        # products' files in the private pitch-assets bucket; nobody else touches them.
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/pitch_settings.sql
      - name: Who may approve a PRD born on the server
        # A PRD dossier's first spec sets its birthplace once (server when it says phase0: server). A
        # member approves a numbered ◆ PRD holding a spec, a plan and a before/after, pinning the latest
        # version of each kind; a non-member, a ◇ dossier and a missing file are refused. A second
        # approval adds a row; nobody updates or deletes one. dossier_approval() answers the approval
        # in force, and nothing to another workspace (PRD 1299).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/approvals.sql
      - name: Who approves a product's PRDs, and how each person is reached
        # Only a workspace's owner lists a product's approvers, each asked or skipped; a member, another
        # workspace's owner and anyone signed out are refused (42501), a stranger to the workspace or
        # another state (22023). Every member reads the list. Once a member is asked, only asked members
        # approve the product's PRDs; with no product or nobody asked, any member does. Each person's
        # alert channels and push subscriptions are theirs alone (PRD 1322).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_approvers.sql
      - name: Asking a PRD's approvers
        # approval_request() asks the product's members asked to approve except the author, or the
        # author alone when nobody else is; a skipped member is never asked, a second request is
        # re-asked. Requests and voids are read by members and never written or changed directly. Only
        # the service role reads how each asked person is reached, behind their switches; the bell lists
        # the latest request with no approval since (PRD 1322).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/approval_requests.sql
      - name: A push that changes a pinned file voids the approval
        # dossier_push() appends a void only when it adds a version of a kind the approval in force
        # pinned, with another sha256, never editing the approval; dossier_approval() answers its voids,
        # and a new approval is in force again. approval_voids_of_push() names the caller's last push's
        # voids only; only the service role reads how the approver is reached (PRD 1322).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/approval_voiding.sql
      - name: Who may race on a workspace's kart grid
        # Only a player of the workspace with OMNI KART unlocked receives or sends Broadcast and
        # Presence on kart:<workspace id>; another workspace, no kart unlocked, no player row, anon,
        # or a topic that is not kart:<uuid>, nothing (PRD 1572, ADR-0101).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/kart_grid.sql
      - name: A product PRD's id, its product's key and a counter
        # Only an owner sets a product's key, once, in lowercase kebab-case, unique in the workspace.
        # dossier_push() with the key creates the product's next PRD, with no home repository, born on the
        # server, or pushes to one by its number; neither its number nor its product changes. A dossier is
        # keyed by its repository or its product's counter, never both. dossier_approval(),
        # approval_request() and dossier_approve() take either key; another workspace's key is its own.
        # The rollback guard refuses while a product PRD exists. Two creates at once, in two sessions
        # through dblink, take two numbers with no gap (PRD 1548).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_prd_ids.sql
      - name: A product PRD's outbox items and their append-only settlements
        # outbox_item_put() writes an item row with its typed columns and its markdown, rewritten while
        # it is open; outbox_settle() appends one settlement and refuses a second, and a non-member;
        # outbox_item_adopt() settles a medium item adopted. A settlement is never updated or deleted,
        # and another workspace reads nothing (PRD 1548).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/outbox_items.sql
      - name: Who may read and write the runners, and how a runner claims a job
        # A member of the workspace reads its runners and jobs, anyone else nothing, and nobody signed in
        # writes them or claims. As the service role, a runner claims the oldest queued job sent to it, to
        # its fleet, or, with no fleet only, to any runner, for a repository it holds, while a slot is free;
        # a runner silent past the cutoff leaves its jobs failed, runner lost. Two runners claiming one job
        # at once, in two sessions through dblink: exactly one takes it (PRD 1830).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runners.sql
      - name: A runner job's live lines
        # Members read their workspace's lines, nobody else does, only the service role writes; a line
        # sent twice is stored once, retention keeps the listed jobs' lines, a deleted job takes its
        # lines with it (PRD 1904).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runner_job_lines.sql
      - name: A runner job's questions, and what answering or dismissing does
        # Members read their workspace's questions, nobody else does, only the service role writes. The
        # first answer queues the resume line to the first job's repository and target as the answerer
        # and stores the answers once; a second answer, a dismissal after it, an account outside the
        # workspace, answers that do not match the questions and a job not waiting are refused and change
        # nothing; a refused queue stores nothing; a dismissal queues no job (PRD 2255).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runner_job_questions.sql
      - name: Who sent a runner job
        # A job has exactly one sender, a person or the Omni app: both and neither are refused, no app but
        # omni-app is accepted, members of the workspace read an app-sent job, another workspace reads
        # nothing, and nobody signed in writes one (PRD 2338).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runner_job_sender.sql
      - name: What a runner job's ending may say
        # A job's outcome is one of the words a job ends on and nothing else (PRD 2425 adds six); its slice
        # count is both numbers or neither, with 0 <= merged <= total; members read the columns, nobody
        # signed in writes them (PRD 2375).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runner_job_outcome.sql
      - name: A runner's health and its samples
        # Members read their workspace's samples and runners' last health, nobody else does, only the
        # service role writes; a sample is one per runner and instant, a figure out of range is refused,
        # the trim deletes one runner's old samples only, a deleted runner takes its samples (PRD 2102).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/runner_samples.sql
      - name: Who may make, list and revoke an API key, and which key the API accepts
        # Only a workspace's owner makes or revokes a key; any member lists them, never the hash; a key's
        # repositories are ones the workspace tracks, its name unique among the live keys, 20 at most.
        # api_key_of() runs for the service role only and answers nothing for a revoked key, a key whose
        # maker left, a business link or a kit token; last used moves once a minute (PRD 2022).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/api_keys.sql
      - name: Who may answer and dismiss a job an API key sent, and whose it stays
        # A key closes the round of a job a key sent, and only a live key of the job's workspace whose maker
        # is still a member and whose repositories hold the job's; a person or a key closes a round, never
        # both, and the first close wins. The resume of a key's job keeps the key and its maker whoever
        # answered, and a job already continued is not answered again; the new outcome words, the pull
        # requests a job opened and the key that acted are stored and read by members only (PRD 2425).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/api_key_jobs.sql
      - name: What a job keeps of the problems a bug fix saw and did not fix, and who reads it
        # runner_jobs.follow_ups is a list of at most five entries, [] for a new job: a sixth entry and a
        # value that is not a list are refused; a member of the workspace reads it with the job, a member of
        # another workspace reads none of it, and only the service role writes it (PRD 2508).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/bug_fix_follow_ups.sql
      - name: Who attaches an API key's GitHub App, and which runner takes the jobs of a key that holds one
        # Only an owner of the key's workspace attaches, replaces or removes the App of a live API key; any
        # member lists its slug, an owner also its last mint, nobody the sealed key, and the tables are read
        # by no one signed in. Revoking the key, by either function, deletes the row. The service role alone
        # opens a job's App; a runner without githubApp never takes the job of a key that holds an App, or
        # one queued while it did (PRD 2433).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/api_key_github_apps.sql
      - name: Who archives and restores a product, and what stops answering for it
        # Only a workspace's owner archives or restores a product; a member no longer reads it, an owner
        # does. Every lookup the kit and agents use skips it, the owner's too, and says so in words; a call
        # naming it by key or id is refused (P0002); nothing under it is erased, and restore brings it all
        # back (PRD 2232).
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/checks/product_archive.sql

  deploy:
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-production    # two pushes never migrate together
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}   # a personal access token of the Supabase org
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}     # the production database password
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # pinned: `latest` asks the GitHub API, which rate-limits
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      # --include-all: a migration dated before one production already applied still goes in, rather than
      # blocking every deploy after it. The `check` job refuses one, but only against the main it saw: a
      # later migration that merges after it ran is applied here (PRD 1364, 2026-10-11).
      - run: supabase db push --include-all   # migrations only; the demo seed never reaches production
