# Production's safety net (PRD 1646). Vercel deploys main from the `release` workflow's commit and
# skips the merge before it (scripts/vercel-ignore.sh): when a `release` run fails or is cancelled, no
# release commit comes. This workflow then marks main's head vercel/production-fallback, so the ignore
# step builds it, and calls each Vercel project's Deploy Hook for main. A release run skipped for a
# release commit concludes `skipped` and calls nothing. The release workflow itself stays the one job
# PRD 347 pins (kit/release/workflow.test.ts).
#
# Needs the secrets VERCEL_DEPLOY_HOOK_GALAXY_MAIN and VERCEL_DEPLOY_HOOK_OMNI_APP_MAIN (galaxy's
# README, When Vercel builds): an unset one is a warning.
name: release-fallback
on:
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  statuses: write
jobs:
  deploy-main:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HOOK_GALAXY: ${{ secrets.VERCEL_DEPLOY_HOOK_GALAXY_MAIN }}
      HOOK_OMNI_APP: ${{ secrets.VERCEL_DEPLOY_HOOK_OMNI_APP_MAIN }}
    steps:
      - name: deploy main through the Vercel Deploy Hooks
        run: |
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)" || head="${{ github.event.workflow_run.head_sha }}"
          gh api -X POST "repos/${{ github.repository }}/statuses/$head" -f state=success \
            -f context=vercel/production-fallback -f description="the release did not land: deploy this commit" >/dev/null \
            || echo "::warning::could not mark $head vercel/production-fallback"
          for hook in "$HOOK_GALAXY" "$HOOK_OMNI_APP"; do
            if [ -z "$hook" ]; then echo "::warning::a Vercel Deploy Hook secret is not set"; continue; fi
            curl -sf -X POST "$hook" >/dev/null || echo "::warning::a Vercel Deploy Hook call failed"
          done
