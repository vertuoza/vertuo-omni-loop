# Secret scanning and push protection, kept on (PRD 1717): once a day at 06:17 UTC, and on demand,
# `node scripts/security-settings.ts` reads the repository's two settings and its open secret scanning
# alerts. On red it opens one issue labelled omni:security, titled `Security settings: <what is wrong>`
# (the script's summary line), whose body is the script's output, or comments the new output on the
# one already open; on green it closes the open one with a comment. A red day also fails the run. It
# checks out the repository read-only, installs nothing (the script uses Node's built-ins only) and
# pushes nothing.
#
# Off until the repository secret SECURITY_READ_TOKEN is set: the token job says whether it is, and
# the watch job runs only when it is. The workflow's own GITHUB_TOKEN reads neither the settings nor
# the alerts, so the script reads with that token; the issue is written with GITHUB_TOKEN.
# Setup, by an admin of the repository:
#   1. Create a fine-grained token: GitHub › Settings › Developer settings › Personal access tokens ›
#      Fine-grained tokens › Generate new token. Resource owner vertuoza, "Only select repositories":
#      vertuoza/vertuo-omni-loop, and two repository permissions, nothing else:
#      Administration: read and Secret scanning alerts: read (GitHub adds Metadata: read itself).
#   2. Store it as the repository secret SECURITY_READ_TOKEN: the repository's Settings › Secrets and
#      variables › Actions › New repository secret. When it expires, the run goes red with the HTTP
#      status of the failed read; a new token in the same secret fixes it.
#   3. Create the label once (labels.autoCreate is false here, so nothing else creates it):
#      gh label create omni:security --color B60205 --description "Secret scanning or push protection is off, or an alert is open"
#
# On every pull request (PRD 2305), two jobs that hold no secret and write nothing:
# - `open-source` runs `node scripts/open-source.ts`: no tracked file names another repository of the
#   maintainer, an address on its domain or a secret (the pre-push hook runs it too).
# - `gitleaks` downloads the gitleaks binary (MIT) at a pinned version, checks its SHA-256 and scans
#   the pull request's commits with .gitleaks.toml, whose allowlist holds the visible fakes. Not
#   gitleaks-action, which needs a paid licence on an organisation's repositories. To move to a newer
#   version, change GITLEAKS_VERSION and GITLEAKS_SHA256 together: the release's
#   gitleaks_<version>_checksums.txt holds the linux_x64 archive's checksum.
name: security
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  token:
    # A job's `if` cannot read a secret: this job reads it and says only whether it is set. A pull
    # request runs neither this job nor the watch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.token.outputs.set }}
    steps:
      - id: token
        env:
          SECURITY_READ_TOKEN: ${{ secrets.SECURITY_READ_TOKEN }}
        run: |
          if [ -n "$SECURITY_READ_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "set=false" >> "$GITHUB_OUTPUT"; fi

  watch:
    needs: token
    if: needs.token.outputs.set == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    concurrency:
      group: security    # two runs never open two issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Read the settings and the open alerts
        id: report
        env:
          GH_TOKEN: ${{ secrets.SECURITY_READ_TOKEN }}
        run: |
          code=0
          node scripts/security-settings.ts > "$RUNNER_TEMP/security.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/security.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the omni:security issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.report.outputs.code }}
          REPORT: ${{ runner.temp }}/security.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label omni:security --state open --json number --jq '.[0].number // empty')
          summary=$(tail -n 1 "$REPORT")
          if [ "$CODE" = "0" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "$summary, read by $RUN_URL"
            fi
            exit 0
          fi
          case "$summary" in
            'security settings: red: '*) wrong=${summary#security settings: red: } ;;
            *) wrong='the check did not finish' ;;
          esac
          body="$RUNNER_TEMP/security-issue.md"
          {
            echo "\`node scripts/security-settings.ts\` is red, read by $RUN_URL. Each line names its fix."
            echo
            echo '```text'
            cat "$REPORT"
            echo '```'
          } > "$body"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "Security settings: $wrong" --label omni:security --body-file "$body"
          fi
      - name: Fail the run on red
        env:
          CODE: ${{ steps.report.outputs.code }}
        run: |
          exit "$CODE"

  # The open-source guard (PRD 2305): Node's built-ins only, so nothing is installed.
  open-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/open-source.ts

  # gitleaks over the pull request's commits (PRD 2305): the binary at a pinned version, refused unless
  # its archive matches the checksum. --redact keeps a value it finds out of the log.
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # The whole history, so the range from the base to the head is there to read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks and check its SHA-256
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" > "$RUNNER_TEMP/gitleaks.sha256"
          sha256sum -c "$RUNNER_TEMP/gitleaks.sha256"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .
